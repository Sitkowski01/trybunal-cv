name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typy, lint, reguly architektury, testy z pokryciem
        run: pnpm check
      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Przegladarka dla Playwrighta
        run: pnpm --filter @trybunal/web exec playwright install --with-deps chromium
      - name: E2E (API w probie generalnej + zbudowany frontend)
        run: pnpm --filter @trybunal/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: apps/web/e2e/playwright-report

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mutation testing (Stryker, prog 90%)
        run: pnpm mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker
          path: |
            packages/*/reports/mutation
            apps/*/reports/mutation
            evals/reports/mutation
