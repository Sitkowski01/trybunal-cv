name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typy, lint, reguly architektury, testy z pokryciem
        run: pnpm check
      - name: Build
        run: pnpm build

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mutation testing (Stryker, prog 90%)
        run: pnpm mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker
          path: packages/*/reports/mutation
