# Cala aplikacja lokalnie: docker compose up --build  ->  http://localhost:8080
# Bez klucza rozprawy ida w probie generalnej (bez modelu). Z modelem (klucz w pliku, nie w zmiennej):
#   ANTHROPIC_API_KEY_FILE=./sciezka/do/klucza TRYBUNAL_REHEARSAL=0 docker compose up --build
services:
  # Sekrety losowane przy pierwszym starcie i trzymane w wolumenie, a nie wpisane w repozytorium:
  # klucz glowny szyfrowania dziennika i haslo bazy. Kazdy plik czyta tylko jego wlasciciel
  # (1000 = node w obrazie API, 70 = postgres w obrazie bazy). Usuniecie wolumenu = utrata rozpraw.
  keygen:
    image: alpine:3.22
    command:
      - sh
      - -c
      - |
        set -e
        umask 077
        test -s /keys/master || head -c 32 /dev/urandom | base64 > /keys/master
        test -s /keys/db-password || head -c 32 /dev/urandom | base64 | tr -d '/+=\n' > /keys/db-password
        echo "postgres://trybunal:$$(cat /keys/db-password)@db:5432/trybunal" > /keys/database-url
        chown 1000 /keys/master /keys/database-url
        chown 70 /keys/db-password
    volumes:
      - keys:/keys

  db:
    image: postgres:17-alpine
    depends_on:
      keygen: { condition: service_completed_successfully }
    # Port bazy nie jest wystawiony na zewnatrz — tylko siec compose.
    environment:
      POSTGRES_USER: trybunal
      POSTGRES_PASSWORD_FILE: /keys/db-password
      POSTGRES_DB: trybunal
    volumes:
      - db:/var/lib/postgresql/data
      - keys:/keys:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "trybunal"]
      interval: 2s
      retries: 30

  # Dwie instancje za nginx: zdarzenia rozpraw i anulowanie ida miedzy nimi przez Postgres NOTIFY,
  # wiec strumien SSE moze trafic do innej instancji niz ta, ktora prowadzi rozprawe.
  api:
    build: { context: ., target: api }
    deploy:
      replicas: 2
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL_FILE: /keys/database-url
      TRYBUNAL_MASTER_KEY_FILE: /keys/master
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
      TRYBUNAL_REHEARSAL: ${TRYBUNAL_REHEARSAL:-1}
      # W probie generalnej przerwa przed odpowiedzia — widac kolejne fazy na scenie.
      TRYBUNAL_REHEARSAL_DELAY_MS: ${TRYBUNAL_REHEARSAL_DELAY_MS:-1500}
      # Za nginx: limit wniesien liczony per adres klienta, nie per proxy.
      TRUST_PROXY: "1"
    secrets:
      - anthropic_api_key
    volumes:
      - keys:/keys:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 2s
      retries: 30

  web:
    build: { context: ., target: web }
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  db:
  keys:

# Klucz API jako sekret (plik w /run/secrets), a nie zmienna srodowiska widoczna w docker inspect.
# Bez ANTHROPIC_API_KEY_FILE pusty plik z repozytorium — wtedy tylko proba generalna.
# Plik musi byc czytelny dla uzytkownika node (uid 1000) w kontenerze.
secrets:
  anthropic_api_key:
    file: ${ANTHROPIC_API_KEY_FILE:-./docker/brak-klucza}
