# Naglowki bezpieczenstwa dla kazdej odpowiedzi. Osobny plik, bo add_header w bloku location
# kasuje odziedziczone z server — /assets/ dolacza go jeszcze raz obok swojego Cache-Control.
# CSP: tylko wlasne skrypty i polaczenia; blob: i data: dla tekstur wbudowanych w modele GLB.
# style-src 'unsafe-inline': atrybuty style ustawiane przez React i sale 3D.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# Id rozprawy stoi w adresie strony — nie moze wyjsc w naglowku Referer, nawet do wlasnego API.
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
