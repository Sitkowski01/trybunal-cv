# Frontend z plikow statycznych, API pod /api (ta sama domena, bez CORS) — jak proxy Vite w dev.
server {
    listen 80;
    root /usr/share/nginx/html;
    # CV jako PDF do 2 MiB plus pola formularza.
    client_max_body_size 3m;

    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Nadpisane, nie dopisane: klient nie podrzuci cudzego adresu i nie obejdzie limitu wniesien.
        proxy_set_header X-Forwarded-For $remote_addr;
        # Strumien SSE: bez buforowania i bez zrywania dlugiej rozprawy.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Pliki z hashem w nazwie nie zmieniaja sie nigdy.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
