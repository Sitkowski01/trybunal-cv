# Frontend z plikow statycznych, API pod /api (ta sama domena, bez CORS) — jak proxy Vite w dev.

# Id rozprawy to jedyny klucz do jej odczytu i usuniecia, a stoi w adresie API (/api/trials/<id>)
# i strony (?trial=<id>, wiec tez w naglowku Referer). Log bez query stringa i bez Referer, id zamazane.
map $uri $log_uri {
    ~^(?<prefix>/api/trials/)[^/]+(?<rest>.*)$ $prefix:id$rest;
    default $uri;
}
log_format bez_id '$remote_addr [$time_local] "$request_method $log_uri" $status $body_bytes_sent $request_time';

server {
    listen 80;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log bez_id;
    # CV jako PDF do 2 MiB plus pola formularza.
    client_max_body_size 3m;

    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Nadpisane, nie dopisane: klient nie podrzuci cudzego adresu i nie obejdzie limitu wniesien.
        proxy_set_header X-Forwarded-For $remote_addr;
        # Strumien SSE: bez buforowania i bez zrywania dlugiej rozprawy.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Pliki z hashem w nazwie nie zmieniaja sie nigdy.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
